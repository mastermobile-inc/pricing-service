  - id: release-status
    command: /usr/local/sbin/mm-pricing-service-release status
    expected_result: Активный release указывает на commit кандидата, freeze отсутствует, strict=true.
  - id: service-status
    command: systemctl is-active pricing-service.service
    expected_result: Служба возвращает active.
  - id: live-asset
    command: rg -n "Поиск по всему портфелю|Клиент найден в портфеле" /opt/MM/pricing-service-task43-current/ui/dist/assets
    expected_result: В активном собранном frontend присутствуют новые подписи поиска и состояния клиента.
  - id: production-data-readback
    command: /opt/MM/pricing-service-task43-current/.venv/bin/python -c "read-only query for РБ002793"
    expected_result: В production-БД клиент существует и имеет технический статус data_check без разрешения изменения типа цены.
stop_condition: При ошибке deploy или smoke не публиковать ответ Арсену; проверить фактический active release и использовать штатный rollback, если переключение произошло частично.
