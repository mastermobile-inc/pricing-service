verification:
  - id: candidate-tests
    command: TMPDIR=/dev/shm /opt/MM/pricing-service/.venv/bin/python -m pytest -x -q --tb=short
    expected_result: Полный pytest точного кандидата завершается без failures/errors; адресные FIFO-регрессии проходят.
  - id: static-checks
    command: Ruff, Black с одним worker, scripts/export_openapi.py --check и workspace validate_project_docs.py для отдельного checkout.
    expected_result: Все четыре проверки завершаются с кодом 0.
  - id: release
    command: /usr/local/sbin/mm-pricing-service-release status; build; check; switch; status
    expected_result: Чистый опубликованный кандидат содержит активную базу, переключение подтверждено manifest и health.
  - id: financial-readback
    command: Приватный preflight/backup и readback существующих карточек, кеша и метаданных поля.
    expected_result: Документы соответствуют FIFO и возрасту; общий долг и ручные статусы сохранены; SMS и новые карточки отсутствуют.
  - id: workplace-smoke
    command: Проверка обоих входов рабочего приложения и раскрытия погашений и возвратов.
    expected_result: Рабочие серверные данные согласованы; граница личной авторизации CRM явно указана, без подмены E2E.
stop_condition: Остановить запись при расхождении сумм, смене активной базы, неполном плане или регрессии; завершение только после evidence и независимого review.
