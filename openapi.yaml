            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /api/products/{article}/recommendation:
    get:
      summary: Get Recommendation
      operationId: get_recommendation_api_products__article__recommendation_get
      parameters:
      - name: article
        in: path
        required: true
        schema:
          type: string
          title: Article
      - name: min_margin
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          default: '0.1'
          title: Min Margin
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
